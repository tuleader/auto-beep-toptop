<title>Auto Beep TopTop</title>
<style>
/* Auto Beep TopTop — design tokens + layout. Dark-first, one accent (beep orange), one success, one danger. */
:root {
  --bg: #0f1117; --bg-2: #161a23; --bg-3: #1d2230; --line: #262c3a; --line-2: #313a4c;
  --text: #e6e9f0; --text-2: #a5adbe; --text-3: #6f7889;
  --accent: #ff7a1a; --accent-2: #ff9a4d; --accent-soft: rgba(255,122,26,.14);
  --ok: #34d399; --ok-soft: rgba(52,211,153,.14); --warn: #fbbf24; --warn-soft: rgba(251,191,36,.14);
  --bad: #f87171; --bad-soft: rgba(248,113,113,.14); --info: #60a5fa; --info-soft: rgba(96,165,250,.14);
  --radius: 10px; --radius-s: 6px; --sidebar: 236px; --shadow: 0 10px 40px rgba(0,0,0,.45);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.45 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-2); }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid var(--bg); }

.app { display: grid; grid-template-columns: var(--sidebar) 1fr; height: 100vh; }

/* ---------- sidebar ---------- */
.sidebar { background: var(--bg-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 14px 12px; gap: 6px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.brand-badge { width: 34px; height: 34px; border-radius: 9px; object-fit: contain; display: block; }
.brand-name { font-weight: 700; font-size: 15px; line-height: 1.1; } .brand-sub { color: var(--text-3); font-size: 11.5px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0; background: transparent; color: var(--text-2); cursor: pointer; text-align: left; width: 100%; }
.nav-item:hover { background: var(--bg-3); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }
.nav-item .ico { width: 18px; height: 18px; flex: none; }
.nav-item .cnt { margin-left: auto; font-size: 11px; color: var(--text-3); background: var(--bg-3); padding: 1px 7px; border-radius: 99px; }
.sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg-3); border: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.chip.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); } .chip.bad .dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); } .chip.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.chip b { color: var(--text); font-weight: 600; }
.donate-btn { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; border: 1px solid rgba(255,122,26,.35); background: linear-gradient(135deg, rgba(255,122,26,.22), rgba(255,77,109,.18)); color: var(--text); cursor: pointer; text-align: left; }
.donate-btn:hover { border-color: var(--accent); background: linear-gradient(135deg, rgba(255,122,26,.32), rgba(255,77,109,.26)); }
.donate-btn .ico { width: 20px; height: 20px; color: var(--accent-2); flex: none; }
.donate-btn b { display: block; font-size: 13px; } .donate-btn small { color: var(--text-2); font-size: 11.5px; }
.version { color: var(--text-3); font-size: 11px; padding: 4px 8px; display: flex; justify-content: space-between; }
.version button { background: none; border: 0; color: var(--text-3); cursor: pointer; padding: 0; } .version button:hover { color: var(--text); }
.lang-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 8px; font-size: 11px; color: var(--text-3); }
.lang-toggle button { background: none; border: 2px solid transparent; border-radius: 4px; cursor: pointer; padding: 1px; line-height: 0; opacity: .45; filter: saturate(.6); transition: opacity .15s; }
.lang-toggle .lang-label { font-size: 11px; color: var(--text-3); margin-right: 4px; }
.lang-toggle button svg { display: block; border-radius: 2px; }
.lang-toggle button:hover { opacity: .85; }
.lang-toggle button.active { opacity: 1; filter: none; border-color: var(--accent-2); }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--bg); }
.topbar h1 { font-size: 18px; margin: 0; font-weight: 700; } .topbar .sub { color: var(--text-3); font-size: 12.5px; }
.topbar .spacer { flex: 1; }
.content { flex: 1; overflow: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--text); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--text-3); } .btn:disabled { opacity: .45; cursor: not-allowed; }
.btn .ico { width: 15px; height: 15px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #17100a; font-weight: 600; } .btn.primary:hover { background: var(--accent-2); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #05261a; font-weight: 600; }
.btn.danger { background: transparent; border-color: rgba(248,113,113,.5); color: var(--bad); } .btn.danger:hover { background: var(--bad-soft); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 8px; font-size: 12px; border-radius: 6px; }
.btn.icon { padding: 6px; }
.search { position: relative; } .search input { padding-left: 30px; width: 240px; }
.search .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--text-3); }
input, select, textarea { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; color: var(--text); outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type="number"] { width: 84px; } input[type="checkbox"] { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
textarea { width: 100%; min-height: 110px; resize: vertical; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--text-2); } label.field > span { font-weight: 600; color: var(--text-2); }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .row.gap-lg { gap: 14px; }
.stats { display: flex; gap: 10px; }
.stat { padding: 8px 14px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); min-width: 92px; }
.stat b { display: block; font-size: 18px; line-height: 1.1; } .stat span { font-size: 11.5px; color: var(--text-3); }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }
.hint { color: var(--text-3); font-size: 12px; } .hint code, .mono { font-family: var(--mono); font-size: 12px; }
.card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.card h3 { margin: 0 0 10px; font-size: 13.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-2); }
/* Collapsible left-column cards on the Beep page (owner's spec 2026-09-25 evening): the h3 becomes a
   clickable/keyboard-focusable button with a chevron; collapsed cards hide their .card-body. */
.card.collapsible > h3 { margin: 0 0 10px; }
.card.collapsed > h3 { margin-bottom: 0; }
.card-toggle { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 7px; width: 100%; cursor: pointer; border-radius: 4px; }
.card-toggle:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft); }
/* Border-triangle chevron (not a Unicode glyph — see beep.js comment): points down expanded, right collapsed. */
.card-toggle .chev { flex: none; width: 0; height: 0; margin: 2px 1px 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--text-3); transition: transform .15s ease; }
.card.collapsed .card-toggle .chev { transform: rotate(-90deg); }
.card.collapsed > .card-body { display: none; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 12px; border-radius: 6px; font-size: 12.5px; }
.callout.warn { border-color: var(--warn); background: var(--warn-soft); } .callout.info { border-color: var(--info); background: var(--info-soft); }
.seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--text-2); padding: 5px 12px; border-radius: 6px; cursor: pointer; }
.seg button.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 600; }

/* ---------- table ---------- */
.table-wrap { border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; background: var(--bg-2); flex: 1; min-height: 240px; }
table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
th { position: sticky; top: 0; background: var(--bg-3); color: var(--text-2); font-weight: 600; font-size: 12px; z-index: 1; }
tr:hover td { background: rgba(255,255,255,.02); } tr.selected td { background: var(--accent-soft); }
td.dim { color: var(--text-3); } td.mono { font-family: var(--mono); font-size: 12px; } td .truncate { max-width: 220px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; }
.badge.live { background: var(--ok-soft); color: var(--ok); } .badge.die { background: var(--bad-soft); color: var(--bad); } .badge.checkpoint { background: var(--warn-soft); color: var(--warn); } .badge.unknown { background: var(--bg-3); color: var(--text-3); }
.badge.info { background: var(--info-soft); color: var(--info); }
.pdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); margin-right: 6px; } .pdot.live { background: var(--ok); } .pdot.die { background: var(--bad); }
.empty { padding: 40px; text-align: center; color: var(--text-3); }
.empty b { display: block; color: var(--text-2); margin-bottom: 4px; }
.pw { font-family: var(--mono); letter-spacing: 1px; } .pw button { background: none; border: 0; color: var(--text-3); cursor: pointer; padding: 0 4px; }

/* ---------- comment view (Beep) ---------- */
/* Left ~55% config cards, right ~45% accounts + run controls + results + log (owner's layout spec 2026-09-25). */
.beep-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; align-items: start; min-height: 0; }
.beep-left, .beep-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 1365px) { .beep-grid { grid-template-columns: 1fr; } }
.range { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .range input { width: 70px; }
.log { background: #0b0d12; border: 1px solid var(--line); border-radius: var(--radius); font-family: var(--mono); font-size: 12px; padding: 10px 12px; overflow: auto; min-height: 140px; max-height: 260px; }
.log div { white-space: pre-wrap; } .log .warn { color: var(--warn); } .log .error { color: var(--bad); } .log time { color: var(--text-3); margin-right: 8px; }
.progress { height: 6px; background: var(--bg-3); border-radius: 99px; overflow: hidden; } .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.acc-pick { max-height: 220px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.acc-pick label { display: flex; gap: 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12.5px; } .acc-pick label:last-child { border-bottom: 0; }

/* ---------- settings ---------- */
/* 2-column responsive grid ≥1400px (item 9b): "Trình duyệt" | "Cửa sổ & luồng"; "Captcha" | "Dữ liệu/khác". */
.settings-grid { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; max-width: 1600px; }
@media (min-width: 1400px) { .settings-grid { grid-template-columns: 1fr 1fr; } }
.settings-grid .card { width: 100%; }
.settings-grid .card.span-2 { grid-column: 1 / -1; }
.form-grid { display: grid; grid-template-columns: 220px 1fr; gap: 10px 16px; align-items: center; }
.form-grid .lbl { color: var(--text-2); font-size: 12.5px; } .form-grid .lbl small { display: block; color: var(--text-3); font-size: 11.5px; }

/* ---------- modal ---------- */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 50; animation: fade .12s ease-out; }
.modal { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 14px; width: min(760px, 94vw); max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow); animation: pop .14s ease-out; }
.modal.lg { width: min(960px, 94vw); } .modal.sm { width: min(460px, 94vw); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); } .modal-head h2 { margin: 0; font-size: 16px; }
.modal-head .x { margin-left: auto; background: none; border: 0; color: var(--text-3); cursor: pointer; font-size: 18px; } .modal-head .x:hover { color: var(--text); }
.modal-body { padding: 16px 18px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); } .modal-foot .spacer { flex: 1; }
@keyframes fade { from { opacity: 0 } } @keyframes pop { from { transform: translateY(8px); opacity: 0 } }

/* terms */
.terms-body { height: 62vh; overflow: auto; padding-right: 6px; } .terms-body h4 { margin: 16px 0 6px; font-size: 14px; } .terms-body p, .terms-body li { color: var(--text-2); font-size: 13px; } .terms-body ul { padding-left: 20px; margin: 6px 0; }
.terms-body .defs dt { font-weight: 600; margin-top: 8px; } .terms-body .defs dd { margin: 2px 0 0; color: var(--text-2); }
.terms-checks { display: flex; flex-direction: column; gap: 6px; } .terms-checks label { display: flex; gap: 8px; align-items: center; } .terms-checks label.off { opacity: .5; }
.scroll-hint { color: var(--warn); font-size: 12px; }

/* donate */
.donate { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
.donate .why h3 { margin: 0 0 8px; font-size: 18px; } .donate .why p { color: var(--text-2); margin: 0 0 10px; }
.donate .why ul { color: var(--text-2); padding-left: 18px; margin: 0 0 10px; }
.qr-card { background: #fff; color: #17100a; border-radius: 14px; padding: 14px; text-align: center; }
.qr-card img { width: 100%; border-radius: 8px; display: block; }
.bank { background: var(--bg-3); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 12px; }
.bank .kv { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line-2); font-size: 13px; } .bank .kv:last-child { border: 0; }
.bank .kv b { font-family: var(--mono); font-size: 14px; letter-spacing: .5px; }
.bank .kv button { background: none; border: 1px solid var(--line-2); color: var(--text-2); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 11.5px; } .bank .kv button:hover { color: var(--text); border-color: var(--text-3); }

/* toast */
.toast-root { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
.toast { background: var(--bg-3); border: 1px solid var(--line-2); border-left: 3px solid var(--info); border-radius: 8px; padding: 10px 14px; min-width: 260px; max-width: 420px; box-shadow: var(--shadow); animation: pop .14s ease-out; }
.toast.ok { border-left-color: var(--ok); } .toast.error { border-left-color: var(--bad); } .toast.warn { border-left-color: var(--warn); }
.toast b { display: block; margin-bottom: 2px; } .toast small { color: var(--text-2); }
.notice-banner { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); border: 1px solid rgba(251,191,36,.4); }
.notice-banner .ico { width: 20px; height: 20px; color: var(--warn); flex: none; }
.notice-banner .spacer { flex: 1; }

html, body { height: 100%; }
body { padding: 0; }
.preview-tag { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); background: rgba(255,122,26,.9); color: #17100a; font: 600 11px/1 var(--font); padding: 5px 10px; border-radius: 99px; z-index: 70; letter-spacing: .04em; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } .sidebar { flex-direction: row; flex-wrap: wrap; align-items: center; } .sidebar-bottom { margin-top: 0; margin-left: auto; flex-direction: row; } .comment-layout { grid-template-columns: 1fr; } .content > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; } }
</style>
